name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK (Latest patch)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.404'

    - name: Restore NuGet packages
      run: dotnet restore RaceDay.API.sln

    - name: Build solution
      run: dotnet build RaceDay.API.sln --no-restore --configuration Release

    - name: Run all unit tests
      run: dotnet test RaceDay.API.sln --no-build --configuration Release --verbosity normal
