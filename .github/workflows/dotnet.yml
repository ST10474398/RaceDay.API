name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Build the API project directly
    - name: Restore API dependencies
      run: dotnet restore RaceDay.API/RaceDay.API.csproj

    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

    # Build the MVC project directly
    - name: Restore MVC dependencies
      run: dotnet restore RaceDay.API/RaceDay.MVC/RaceDay.MVC.csproj

    - name: Build MVC
      run: dotnet build RaceDay.API/RaceDay.MVC/RaceDay.MVC.csproj --no-restore --configuration Release

    # Run the tests
    - name: Restore Test dependencies
      run: dotnet restore RaceDay.test/RaceDay_test.csproj

    - name: Run Unit Tests
      run: dotnet test RaceDay.test/RaceDay_test.csproj --no-restore --configuration Release --verbosity normal
