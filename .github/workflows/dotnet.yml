name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # 1. Build the API (we know this path is correct)
    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release

    # 2. Find and run the tests (wildcard search)
    - name: Run Unit Tests
      run: dotnet test **/RaceDay_test.csproj --configuration Release --verbosity normal
