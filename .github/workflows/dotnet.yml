name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Build the API
    - name: Build API
      run: dotnet build **/RaceDay.API.csproj --configuration Release

    # Find and build the MVC project (searching all folders)
    - name: Build MVC
      run: dotnet build **/RaceDay.MVC.csproj --configuration Release

    # Find and run the test project (searching all folders)
    - name: Run Unit Tests
      run: dotnet test **/RaceDay_test.csproj --configuration Release --verbosity normal
