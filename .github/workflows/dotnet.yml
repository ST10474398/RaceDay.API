name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore RaceDay.API.sln

    - name: Build
      run: dotnet build RaceDay.API.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test RaceDay.API.sln --no-build --configuration Release --verbosity normal
