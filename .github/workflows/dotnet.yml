name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Build the API project
    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --configuration Release

    # Build the MVC project (nested inside the API folder)
    - name: Build MVC
      run: dotnet build RaceDay.API/RaceDay.MVC/RaceDay.MVC.csproj --configuration Release

    # Run the tests (assuming the test project is also inside the API folder)
    - name: Run Unit Tests
      run: dotnet test RaceDay.API/RaceDay.test/RaceDay_test.csproj --configuration Release --verbosity normal
