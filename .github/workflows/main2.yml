name: .NET CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore packages
      run: dotnet restore RaceDay.API.sln

    - name: Build solution
      run: dotnet build RaceDay.API.sln -c Release

    - name: Run tests (with diagnostic verbosity if fails)
      run: dotnet test RaceDay.API.sln -c Release --logger "console;verbosity=detailed"
